<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEPTA Next Trains</title>
    <link rel="stylesheet" href="./styles.css?v=2026-11-05-3" />
  </head>
  <body>
    <main class="app-shell">
      <section class="controls-card">
        <p class="controls-title">Next 3 Trains</p>

        <div class="line-switcher" aria-label="Choose a Regional Rail line">
          <button class="line-button is-active" type="button" data-line="paoliThorndale">
            Paoli/Thorndale
          </button>
          <button class="line-button" type="button" data-line="manayunkNorristown">
            Manayunk/Norristown
          </button>
          <button class="line-button" type="button" data-line="westTrenton">
            West Trenton
          </button>
          <button class="line-button" type="button" data-line="trenton">
            Trenton
          </button>
        </div>

        <form id="trip-form" class="trip-form">
          <div class="field">
            <label for="origin">Origin</label>
            <input
              id="origin-search"
              class="station-search"
              type="search"
              placeholder="Search stations"
              autocomplete="off"
              aria-label="Search origin stations"
              aria-controls="origin"
            />
            <select id="origin" name="origin">
              <option value="marketEast">Jefferson</option>
              <option value="paoli">Paoli</option>
            </select>
            <p id="origin-search-hint" class="search-hint" aria-live="polite"></p>
          </div>

          <button
            id="swap-button"
            class="swap-button"
            type="button"
            aria-label="Swap origin and destination"
          >
            Swap
          </button>

          <div class="field">
            <label for="destination">Destination</label>
            <input
              id="destination-search"
              class="station-search"
              type="search"
              placeholder="Search stations"
              autocomplete="off"
              aria-label="Search destination stations"
              aria-controls="destination"
            />
            <select id="destination" name="destination">
              <option value="paoli">Paoli</option>
              <option value="marketEast">Jefferson</option>
            </select>
            <p id="destination-search-hint" class="search-hint" aria-live="polite"></p>
          </div>

          <button class="refresh-button" type="submit">Show trains</button>
        </form>

        <div class="meta-row">
          <p id="route-summary" class="route-summary"></p>
          <div class="meta-actions">
            <a href="./alerts.html" class="nav-link">Regional Rail Alerts</a>
            <button id="auto-refresh" class="secondary-button" type="button">
              Auto-refresh: on
            </button>
          </div>
        </div>
      </section>

      <section class="results-card">
        <div class="results-header">
          <h2>Upcoming trains</h2>
          <p id="last-updated" class="last-updated">Loading live data...</p>
        </div>

        <div id="status-message" class="status-message" aria-live="polite"></div>
        <div id="results" class="results-grid" aria-live="polite"></div>
      </section>
    </main>

    <template id="train-card-template">
      <article class="train-card">
        <div class="train-card-top">
          <p class="train-label">Train</p>
          <div class="train-identifiers">
            <p class="train-number"></p>
            <p class="train-consist"></p>
          </div>
        </div>
        <p class="train-time"></p>
        <div class="details-grid">
          <div>
            <span class="detail-label">Departure</span>
            <p class="detail-value departure-time"></p>
          </div>
          <div>
            <span class="detail-label">Arrival</span>
            <p class="detail-value arrival-time"></p>
          </div>
          <div>
            <span class="detail-label">Status</span>
            <p class="detail-value status-text"></p>
          </div>
          <div>
            <span class="detail-label">Track</span>
            <p class="detail-value track-text"></p>
          </div>
        </div>
        <div class="connection" hidden>
          <p class="connection-station"></p>
          <div class="connection-row">
            <p class="connection-train"></p>
            <p class="connection-status"></p>
          </div>
          <p class="connection-time"></p>
          <p class="connection-consist"></p>
        </div>
      </article>
    </template>

    <script src="./app.js?v=2026-11-05-3"></script>
  </body>
</html>
