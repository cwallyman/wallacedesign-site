<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SEPTA Consist Logger</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>SEPTA Consist Logger</h1>
  <div class="datebar">
    <label for="date">Service date</label>
    <input type="date" id="date" />
    <a id="export-link" href="/api/export" download>Download .xlsx</a>
    <span id="last-updated" class="muted"></span>
  </div>
</header>

<main>
  <section>
    <h2>Today's trips</h2>
    <div class="table-wrap">
      <table id="trips-table">
        <thead>
          <tr>
            <th data-key="trainno" class="nowrap"><button type="button">Train #</button></th>
            <th data-key="line"><button type="button">Line</button></th>
            <th data-key="source"><button type="button">Source</button></th>
            <th data-key="dest"><button type="button">Dest</button></th>
            <th data-key="last_consist"><button type="button">Consist</button></th>
            <th data-key="first_seen_at" class="nowrap"><button type="button">First seen</button></th>
            <th data-key="last_seen_at" class="nowrap"><button type="button">Last seen</button></th>
            <th data-key="max_late" class="nowrap"><button type="button">Total delay</button></th>
            <th data-key="delay_start_at"><button type="button">Delay started at</button></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="search">
    <div>
      <h2>Look up a car <span class="muted">(past year)</span></h2>
      <input type="text" id="car-input" placeholder="e.g. 2404" />
      <button id="car-search">Search</button>
      <ul id="car-results"></ul>
    </div>

    <div>
      <h2>Look up a train number</h2>
      <input type="text" id="train-input" placeholder="e.g. 3486" />
      <button id="train-search">Search</button>
      <ul id="train-results"></ul>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
